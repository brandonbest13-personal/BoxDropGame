<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coming Soon</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: #f1f5f9; /* Same slate-50 background */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-card {
      width: 100%;
      max-width: 360px;
      background: #ffffff;
      padding: 36px 24px;
      border-radius: 20px;
      border: 1px solid #cbd5e1;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      color: #16a34a; /* River Hopper green */
      letter-spacing: 1px;
      margin-bottom: 10px;
      font-weight: 800;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #475569;
      line-height: 1.5;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="modal-card">
    <h1>STAY TUNED</h1>
    <p class="subtitle">A new version is coming soon!</p>
  </div>

</body>
</html>
