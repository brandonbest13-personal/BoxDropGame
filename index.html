<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BoxDrop - Version Launcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0713;
      color: #fff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .launcher-card {
      width: 100%;
      max-width: 400px;
      background: #161024;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 28px 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 2px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.tagline {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .version-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .version-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-decoration: none;
      background: #1e182e;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 14px 18px;
      color: #fff;
      transition: transform 0.08s ease, background 0.15s ease;
    }

    .version-btn:active {
      transform: scale(0.97);
      background: #2d2442;
    }

    .version-title {
      font-size: 1rem;
      font-weight: 700;
      color: #f1f5f9;
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .version-title span.badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(168, 85, 247, 0.25);
      color: #c084fc;
    }

    .version-desc {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="launcher-card">
    <h1>BOXDROP</h1>
    <p class="tagline">Select a build to play:</p>

    <div class="version-list">
      <!-- Version 2 -->
      <a href="./V2/" class="version-btn">
        <div class="version-title">
          BoxDrop v2
          <span class="badge">Latest</span>
        </div>
        <div class="version-desc">Turn-based, double-tap drop, white wildcards & push-up levels.</div>
      </a>

      <!-- Version 1 -->
      <a href="./V1/" class="version-btn">
        <div class="version-title">
          BoxDrop v1
          <span class="badge">Classic</span>
        </div>
        <div class="version-desc">Real-time falling timer, speed acceleration, and button controls.</div>
      </a>
    </div>
  </div>

</body>
</html>
